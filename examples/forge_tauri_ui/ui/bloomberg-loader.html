<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloomberg</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
    }

    body {
      display: grid;
      place-items: center;
    }

    .logo {
      width: min(34vw, 118px);
      height: min(8vw, 28px);
      background:
        linear-gradient(
          105deg,
          rgba(168, 168, 168, 0.18) 0%,
          rgba(168, 168, 168, 0.22) 41%,
          rgba(242, 242, 236, 0.54) 50%,
          rgba(168, 168, 168, 0.22) 59%,
          rgba(168, 168, 168, 0.18) 100%
        );
      background-size: 260% 100%;
      background-position: 135% 50%;
      -webkit-mask: url("assets/provider-logos/bloomberg-logo.png") center / contain no-repeat;
      mask: url("assets/provider-logos/bloomberg-logo.png") center / contain no-repeat;
      animation: bloombergLogoSheen 5.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    @keyframes bloombergLogoSheen {
      0%, 18% { background-position: 135% 50%; }
      58%, 100% { background-position: -35% 50%; }
    }
  </style>
</head>
<body>
  <div class="logo" aria-hidden="true"></div>
  <script>
    const DEFAULT_URL = "https://www.youtube.com/embed/iEpJwprxDdk?autoplay=1&mute=0&playsinline=1&controls=0&disablekb=1&fs=0&rel=0&modestbranding=1&iv_load_policy=3&cc_load_policy=1&cc_lang_pref=en&enablejsapi=1";
    window.__forgeBloombergStart = (url = DEFAULT_URL) => {
      if (window.__forgeBloombergStarted) return;
      window.__forgeBloombergStarted = true;
      document.title = `FORGE_BLOOMBERG_NAVIGATING:${Date.now()}`;
      window.location.replace(url);
    };
    document.title = `FORGE_BLOOMBERG_LOADER_READY:${Date.now()}`;
  </script>
</body>
</html>
