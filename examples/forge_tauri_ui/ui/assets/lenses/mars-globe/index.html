function parseLensListParam(name) {
  var raw = lensParams.get(name) || '';
  return raw.split(',')
    .map(function(value) { return value.trim().toLowerCase(); })
    .filter(Boolean);
}

function normalizeLocationKey(value) {
  return String(value || '').trim().toLowerCase().replace(/^mars_/, '');
}

function registerRequestedLocationsFromGeoNodes() {
  requestedGeoNodeTags.forEach(function(tag) {
    var locationKey = geoNodeTagToLocationKey[tag] || normalizeLocationKey(tag);
    if (!requestedLocationKeys.includes(locationKey)) {
      requestedLocationKeys.push(locationKey);
    }
  });
  requestedLocationKeys.forEach(function(key) {
    Object.keys(marsSubLocations || {}).forEach(function(parentKey) {
      var subLocs = marsSubLocations[parentKey] || [];
      if (subLocs.some(function(subLoc) { return subLoc.key === key; })) {
        requestedSubLocationParents[key] = parentKey;
        if (!requestedLocationKeys.includes(parentKey)) requestedLocationKeys.unshift(parentKey);
      }
    });
  });
}

// HELPER FUNCTION
function latLonToVector3(lat, lon, radius) {
  var phi = (90 - lat) * (Math.PI / 180);
  var theta = (lon + 180) * (Math.PI / 180);
  var x = -(radius * Math.sin(phi) * Math.cos(theta));
  var y = radius * Math.cos(phi);
  var z = radius * Math.sin(phi) * Math.sin(theta);
  return new THREE.Vector3(x, y, z);
}

// MARKER CREATION FUNCTIONS (les markers seront crÃ©Ã©s aprÃ¨s le chargement du JSON)
function createMarker(key, loc) {
  var radius = 40.3;
  var pos = latLonToVector3(loc.lat, loc.lon, radius);
  var isRequested = requestedLocationKeys.includes(key);
  var markerColor = isRequested ? 0xff5722 : 0xffffff;
  
  // Ring principal
  var ringGeom = new THREE.RingGeometry(0.25, 0.3, 32);
  var ringMat = new THREE.MeshBasicMaterial({ 
    color: markerColor, 
    side: THREE.DoubleSide, 
    transparent: true, 
    opacity: isRequested ? 1 : 0.8 
  });
  var ring = new THREE.Mesh(ringGeom, ringMat);
  
  // Pulse (ring externe)
  var pulseGeom = new THREE.RingGeometry(0.3, 0.35, 32);
  var pulseMat = new THREE.MeshBasicMaterial({ 
    color: markerColor, 
    side: THREE.DoubleSide, 
    transparent: true, 
    opacity: isRequested ? 0.7 : 0.4 
  });
  var pulse = new THREE.Mesh(pulseGeom, pulseMat);
  
  // Dot central
  var dotGeom = new THREE.CircleGeometry(0.15, 16);
  var dotMat = new THREE.MeshBasicMaterial({ 
    color: markerColor, 
    transparent: true, 
    opacity: 1 
  });
  var dot = new THREE.Mesh(dotGeom, dotMat);
  
  var group = new THREE.Group();
  group.add(ring);
  group.add(pulse);
  group.add(dot);
  group.position.copy(pos);
  
  group.userData = {
    key: key,
    name: loc.name,
    dot: dot,
    ring: ring,
    pulse: pulse,
    requested: isRequested,
    startTime: Date.now()
  };
  
  return group;
}

// SUB-MARKER CREATION FUNCTION (les sub-markers seront crÃ©Ã©s aprÃ¨s le chargement du JSON)
function createSubMarker(parentKey, subLoc) {
  var radius = 40.3;
  var pos = latLonToVector3(subLoc.lat, subLoc.lon, radius);
  var isRequested = requestedLocationKeys.includes(subLoc.key);
  var markerColor = isRequested ? 0xff5722 : 0xffffff;
  
  // Petit point blanc simple et discret (toujours blanc)
  var dotGeom = new THREE.CircleGeometry(0.06, 12);
  var dotMat = new THREE.MeshBasicMaterial({ 
    color: markerColor,
    transparent: true, 
    opacity: isRequested ? 1 : 0
  });
  var dot = new THREE.Mesh(dotGeom, dotMat);
  
  // Ring trÃ¨s fin autour (toujours blanc)
  var ringGeom = new THREE.RingGeometry(0.06, 0.075, 12);
  var ringMat = new THREE.MeshBasicMaterial({ 
    color: markerColor,
    side: THREE.DoubleSide, 
    transparent: true, 
    opacity: isRequested ? 0.9 : 0
  });
  var ring = new THREE.Mesh(ringGeom, ringMat);
  
  var group = new THREE.Group();
  group.add(dot);
  group.add(ring);
  group.position.copy(pos);
  group.visible = isRequested;
  
  group.userData = {
    key: subLoc.key,
    parentKey: parentKey,
    name: subLoc.name,
    info: subLoc.info,
    dot: dot,
    ring: ring,
    requested: isRequested,
    isSub: true
  };
  
  return group;
}

// Fonction pour mettre Ã  jour la position des labels HTML des sous-lieux
function updateSubLocationLabels() {
  subMarkers.forEach(function(subMarker) {
    if (subMarker.visible && subMarker.userData.htmlLabel) {
      var worldPos = new THREE.Vector3();
      subMarker.getWorldPosition(worldPos);
      worldPos.project(camera);
      
      var x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
      var y = (-worldPos.y * 0.5 + 0.5) * window.innerHeight;
      
      // Positionner le label Ã  droite du point
      subMarker.userData.htmlLabel.style.left = (x + 8) + 'px';
      subMarker.userData.htmlLabel.style.top = (y - 10) + 'px';
      subMarker.userData.htmlLabel.classList.add('visible');
    } else if (subMarker.userData.htmlLabel) {
      subMarker.userData.htmlLabel.classList.remove('visible');
    }
  });
}

// Fonction pour afficher/masquer les sub-markers
function toggleSubMarkers(parentKey, show) {
  subMarkers.forEach(function(subMarker) {
    if (subMarker.userData.parentKey === parentKey) {
      subMarker.visible = show;
      
      if (show) {
        // Fade in animation
        var startTime = Date.now();
        var fadeIn = setInterval(function() {
          var elapsed = Date.now() - startTime;
          var progress = Math.min(elapsed / 600, 1);
          
          subMarker.userData.dot.material.opacity = progress * 0.8;
          subMarker.userData.ring.material.opacity = progress * 0.5;
          
          if (progress >= 1) {
            clearInterval(fadeIn);
          }
        }, 16);
        
      } else {
        subMarker.userData.dot.material.opacity = 0;
        subMarker.userData.ring.material.opacity = 0;
      }
    }
  });
}

  locationZoomAction.title = deep ? 'Zoom out from location' : 'Zoom deeper on location';
  locationZoomAction.innerHTML = deep
    ? '<svg viewBox="0 0 16 16" focusable="false" aria-hidden="true"><circle cx="7" cy="7" r="3.5"></circle><path d="M11 11 14 14"></path><path d="M5.4 7h3.2"></path></svg>'
    : '<svg viewBox="0 0 16 16" focusable="false" aria-hidden="true"><circle cx="7" cy="7" r="3.5"></circle><path d="M11 11 14 14"></path><path d="M7 5.5v3"></path><path d="M5.5 7h3"></path></svg>';
}

function updateLocationActionsLayout() {
  if (!locationActions || !focusedLocationContext || !locationLabel) return;
  var labelRect = locationLabel.getBoundingClientRect();
  var actionsWidth = locationActions.offsetWidth || 72;
  var maxX = Math.max(12, window.innerWidth - actionsWidth - 12);
  var nextLeft = Math.min(maxX, Math.max(12, labelRect.left + 14));
  var nextTop = Math.max(12, labelRect.bottom + 6);
  locationActions.style.left = nextLeft + 'px';
  locationActions.style.top = nextTop + 'px';
}

function updateSelectedProviderState(next) {
  if (!next) return;
  selectedProviderState.runtime = String(next.runtime || selectedProviderState.runtime || 'codex');
  selectedProviderState.runtimeLabel = String(next.runtimeLabel || selectedProviderState.runtimeLabel || 'Codex');
  selectedProviderState.logoClass = String(next.logoClass || selectedProviderState.logoClass || 'provider-logo-openai');
  if (locationAskLogo) {
    locationAskLogo.className = 'provider-logo ' + selectedProviderState.logoClass;
  }
  if (locationAskAction) {
    var title = 'Ask ' + selectedProviderState.runtimeLabel + ' about this GeoNode';
    locationAskAction.title = title;
    locationAskAction.setAttribute('aria-label', title);
  }
}

function emitPlanetAction(action, payload) {
  if (!window.parent || window.parent === window) return;
  window.parent.postMessage({
    type: 'forge:planet-action',
    action: action,
    payload: payload || {}
  }, '*');
}

window.addEventListener('message', function(event) {
  var data = event && event.data ? event.data : null;
  if (!data || typeof data !== 'object') return;
  if (data.type === 'forge:planet-provider-state') {
    updateSelectedProviderState(data);
    return;
  }
  if (data.type === 'forge:planet-focus') {
    var focusTag = String(data.geonodeTag || '').trim().toLowerCase();
    var focusKey = geoNodeTagToLocationKey[focusTag] || normalizeLocationKey(data.locationKey || focusTag);
    if (!focusKey) return;
    var focusParent = geoNodeTagToLocationKey[String(data.parentTag || '').trim().toLowerCase()] || requestedSubLocationParents[focusKey] || '';
    if (!focusParent) {
      Object.keys(marsSubLocations || {}).some(function(parentKey) {
        var subLocs = marsSubLocations[parentKey] || [];
        if (!subLocs.some(function(subLoc) { return subLoc.key === focusKey; })) return false;
        focusParent = parentKey;
        return true;
      });
    }
    var isSubLocation = !!focusParent && focusParent !== focusKey;
    focusPlanetLocation(isSubLocation ? focusParent : focusKey, {
      deep: isSubLocation,
      requestedSubKey: isSubLocation ? focusKey : '',
      scripted: true
    });
  }
});

function markerBaseColor(marker) {
  return marker && marker.userData && marker.userData.requested ? 0xff5722 : 0xffffff;
}

function subMarkerBaseColor(subMarker) {
  return subMarker && subMarker.userData && subMarker.userData.requested ? 0xff5722 : 0xffffff;
}

function resetMarkerAppearance(marker) {
  if (!marker) return;
  var baseColor = markerBaseColor(marker);
  marker.userData.ring.material.color.setHex(baseColor);
  marker.userData.dot.material.color.setHex(baseColor);
  marker.userData.pulse.material.color.setHex(baseColor);
  marker.userData.ring.material.opacity = marker.userData.requested ? 1 : 0.8;
  marker.userData.dot.material.opacity = 1;
  marker.userData.pulse.material.opacity = marker.userData.requested ? 0.7 : 0.4;
}

function highlightMarker(marker) {
  if (!marker) return;
  marker.userData.ring.material.color.setHex(0xff5722);
  marker.userData.dot.material.color.setHex(0xff5722);
  marker.userData.pulse.material.color.setHex(0xff5722);
  marker.userData.ring.material.opacity = 1;
  marker.userData.dot.material.opacity = 1;
  marker.userData.pulse.material.opacity = 0.75;
}

function resetSubMarkerAppearance(subMarker) {
  if (!subMarker) return;
  var baseColor = subMarkerBaseColor(subMarker);
  subMarker.userData.ring.material.color.setHex(baseColor);
  subMarker.userData.dot.material.color.setHex(baseColor);
  subMarker.userData.ring.material.opacity = subMarker.userData.requested ? 0.9 : 0.45;
  subMarker.userData.dot.material.opacity = subMarker.userData.requested ? 1 : 0.7;
}

function highlightSubMarker(subMarker) {
  if (!subMarker) return;
  subMarker.userData.ring.material.color.setHex(0xff5722);
  subMarker.userData.dot.material.color.setHex(0xff5722);
  subMarker.userData.ring.material.opacity = 0.95;
  subMarker.userData.dot.material.opacity = 1;
}

function hideSubMarkersExcept(parentKey) {
  subMarkers.forEach(function(subMarker) {
    if (subMarker.userData.parentKey === parentKey) return;
    subMarker.visible = false;
    subMarker.userData.dot.material.opacity = 0;
    subMarker.userData.ring.material.opacity = 0;
    if (subMarker.userData.htmlLabel) subMarker.userData.htmlLabel.classList.remove('visible');
  });
}

function clearSubMarkerHover() {
  if (hoveredSubMarker) {
    resetSubMarkerAppearance(hoveredSubMarker);
    hoveredSubMarker = null;
  }
  if (labelSubText) labelSubText.textContent = '';
}

function focusDistanceForLevel(level) {
  if (isInlineEmbed) return level >= 2 ? 82 : 102;
  return level >= 2 ? 66 : 84;
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function startCameraScript(fromPos, toPos, options) {
  focusCameraScript = {
    startMs: performance.now(),
    holdMs: options && options.holdMs ? options.holdMs : 900,
    durationMs: options && options.durationMs ? options.durationMs : 3000,
    fromPos: fromPos.clone(),
    toPos: toPos.clone(),
    finalZoomLevel: options && options.finalZoomLevel ? options.finalZoomLevel : 1
  };
  currentPos.copy(fromPos);
  targetPos.copy(toPos);
  currentZoomLevel = 0;
}

function updateCameraScript(nowMs) {
  if (!focusCameraScript) return false;
  var holdEnd = focusCameraScript.startMs + focusCameraScript.holdMs;
  if (nowMs <= holdEnd) {
    currentPos.copy(focusCameraScript.fromPos);
    camera.position.copy(currentPos);
    camera.lookAt(0, 0, 0);
    return true;
  }
  var progress = Math.min(1, (nowMs - holdEnd) / focusCameraScript.durationMs);
  var eased = easeInOutCubic(progress);
  currentPos.lerpVectors(focusCameraScript.fromPos, focusCameraScript.toPos, eased);
  camera.position.copy(currentPos);
  camera.lookAt(0, 0, 0);
  if (progress >= 1) {
    currentZoomLevel = focusCameraScript.finalZoomLevel;
    targetPos.copy(focusCameraScript.toPos);
    currentPos.copy(focusCameraScript.toPos);
    focusCameraScript = null;
  }
  return true;
}

function focusPlanetLocation(mainKey, options) {
  var marker = markers.find(function(item) { return item.userData.key === mainKey; });
  if (!marker) return;
  var requestedSubKey = options && options.requestedSubKey ? options.requestedSubKey : '';
  var deep = !!(options && options.deep);
  var scripted = !!(options && options.scripted);
  var focusLevel = deep ? 2 : 1;

  markers.forEach(function(item) {
    if (item !== marker) resetMarkerAppearance(item);
  });
  highlightMarker(marker);
  hoveredMarker = marker;
  focusedMarkerKey = marker.userData.key;
  locationLabel.classList.add('visible');
  updateLocationLabel(marker);
  if (labelSubText) labelSubText.textContent = '';

  hideSubMarkersExcept(mainKey);
  if (marsSubLocations[mainKey] && marsSubLocations[mainKey].length > 0) {
    toggleSubMarkers(mainKey, true);
  }
  if (requestedSubKey) {
    subMarkers.forEach(function(subMarker) {
      if (subMarker.userData.key !== requestedSubKey) return;
      subMarker.visible = true;
      highlightSubMarker(subMarker);
      if (labelSubText) labelSubText.textContent = subMarker.userData.name;
      focusedLocationContext = {
        type: 'sub',
        key: subMarker.userData.key,
        parentKey: mainKey,
        name: subMarker.userData.name,
        body: 'mars',
        geonodeTag: geoNodeTagForSubKey(subMarker.userData.key),
        parentGeoNodeTag: geoNodeTagForMainKey(mainKey),
        kind: 'minigeonode'
      };
    });
  } else {
    focusedLocationContext = {
      type: 'main',
      key: marker.userData.key,
      parentKey: '',
      name: marker.userData.name,
      body: 'mars',
      geonodeTag: geoNodeTagForMainKey(marker.userData.key),
      parentGeoNodeTag: '',
      kind: 'geonode'
    };
  }

  var worldPos = new THREE.Vector3();
  marker.getWorldPosition(worldPos);
  var direction = worldPos.clone().normalize();
  var nextTarget = direction.multiplyScalar(focusDistanceForLevel(focusLevel));
  if (scripted) {
    startCameraScript(currentPos.clone(), nextTarget, {
      holdMs: 950,
      durationMs: requestedSubKey ? 3600 : 3200,
      finalZoomLevel: focusLevel
    });
  } else {
    focusCameraScript = null;
    targetPos.copy(nextTarget);
    currentZoomLevel = focusLevel;
  }
  setFocusedLocationContext(focusedLocationContext);
}

container.addEventListener('mousemove', function(event) {
  var rect = container.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  
  // Essayer d'abord les sub-markers (en deep zoom)
  if (currentZoomLevel === 2) {
    var visibleSubMarkers = subMarkers.filter(function(sm) { return sm.visible; });
    var subIntersects = raycaster.intersectObjects(visibleSubMarkers, true);
    
    if (subIntersects.length > 0) {
      var obj = subIntersects[0].object;
      while (obj.parent && !obj.userData.key) {
        obj = obj.parent;
      }
      
      if (obj.userData.key && obj.userData.isSub) {
        if (hoveredSubMarker !== obj) {
          clearSubMarkerHover();
          hoveredSubMarker = obj;
          highlightSubMarker(obj);
          if (labelSubText) labelSubText.textContent = obj.userData.name;
        }
        container.style.cursor = 'pointer';
        return;
      }
    }
  }
  
  clearSubMarkerHover();
  
  var intersects = raycaster.intersectObjects(markers, true);
  
  if (intersects.length > 0) {
    var obj = intersects[0].object;
    while (obj.parent && !obj.userData.key) {
      obj = obj.parent;
    }
    
    if (obj.userData.key) {
      if (hoveredMarker !== obj) {
        if (hoveredMarker && hoveredMarker.userData.key !== focusedMarkerKey) {
          resetMarkerAppearance(hoveredMarker);
        }
        hoveredMarker = obj;
        highlightMarker(obj);
        locationLabel.classList.add('visible');
        updateLocationLabel(obj);
      }
      
      container.style.cursor = 'pointer';
    }
  } else {
    // Ne reset que si vraiment nÃ©cessaire
    if (hoveredMarker && currentZoomLevel === 0 && !intersects.length) {
      resetMarkerAppearance(hoveredMarker);
      hoveredMarker = null;
      
      if (currentZoomLevel === 0) {
        locationLabel.classList.remove('visible');
        if (labelSubText) labelSubText.textContent = '';
      }
    }
    
    container.style.cursor = 'default';
  }
});

// CLICK TO ZOOM
container.addEventListener('click', function() {
  if (hoveredSubMarker) {
    focusPlanetLocation(hoveredSubMarker.userData.parentKey, {
      deep: true,
      requestedSubKey: hoveredSubMarker.userData.key,
      scripted: true
    });
    return;
  }
  if (hoveredMarker) {
    var sameMarker = focusedMarkerKey === hoveredMarker.userData.key;
    focusPlanetLocation(hoveredMarker.userData.key, {
      deep: sameMarker && currentZoomLevel === 1,
      scripted: true
    });
  }
});

if (locationZoomAction) {
  locationZoomAction.addEventListener('click', function(event) {
    event.preventDefault();
    event.stopPropagation();
    if (!focusedLocationContext) return;
    focusPlanetLocation(focusedLocationContext.parentKey || focusedLocationContext.key, {
      deep: currentZoomLevel < 2,
      requestedSubKey: focusedLocationContext.type === 'sub' ? focusedLocationContext.key : '',
      scripted: true
    });
  });
}

if (locationGeonodeAction) {
  locationGeonodeAction.addEventListener('click', function(event) {
    event.preventDefault();
    event.stopPropagation();
    if (!focusedLocationContext) return;
    emitPlanetAction('inject-geonode', {
      tag: focusedLocationContext.geonodeTag,
      label: focusedLocationContext.name,
      kind: focusedLocationContext.kind,
      body: focusedLocationContext.body,
      parentTag: focusedLocationContext.parentGeoNodeTag || ''
    });
  });
}

if (locationAskAction) {
  locationAskAction.addEventListener('click', function(event) {
    event.preventDefault();
    event.stopPropagation();
    if (!focusedLocationContext) return;
    emitPlanetAction('ask-geonode', {
      tag: focusedLocationContext.geonodeTag,
      label: focusedLocationContext.name,
      kind: focusedLocationContext.kind,
      body: focusedLocationContext.body,
      parentTag: focusedLocationContext.parentGeoNodeTag || '',
      runtime: selectedProviderState.runtime,
      runtimeLabel: selectedProviderState.runtimeLabel
    });
  });
}

function applyRequestedPlanetFocus() {
  if (!requestedLocationKeys.length || !markers.length) return;
  var requestedMainKey = requestedLocationKeys.find(function(key) {
    return markers.some(function(marker) { return marker.userData.key === key; });
  });
  var requestedSubKey = requestedLocationKeys.find(function(key) {
    return subMarkers.some(function(marker) { return marker.userData.key === key; });
  });
  var focusKey = requestedMainKey || requestedSubLocationParents[requestedSubKey] || '';
  if (!focusKey) return;
  focusPlanetLocation(focusKey, {
    deep: !!requestedSubKey,
    requestedSubKey: requestedSubKey,
    scripted: true
  });
}

// ANIMATION LOOP
function animate() {
  requestAnimationFrame(animate);
  
  if (!updateCameraScript(performance.now())) {
    currentPos.lerp(targetPos, currentZoomLevel > 0 ? 0.03 : 0.018);
    camera.position.copy(currentPos);
    camera.lookAt(0, 0, 0);
  }
  
  // Rotation de Mars (seulement si pas zoomÃ©)
  if (marsSphere && currentZoomLevel === 0 && !focusCameraScript) {
    marsSphere.rotation.y -= 0.00014;
  }
  
  // Animation des markers
  var cameraDistance = camera.position.length();
  var scale = Math.max(0.3, Math.min(1, cameraDistance / 150));
  
  markers.forEach(function(marker) {
    var elapsed = (Date.now() - marker.userData.startTime) / 1000;
    var pulseScale = scale * (1 + Math.sin(elapsed * 2) * 0.15);
    
    marker.userData.pulse.scale.set(pulseScale, pulseScale, 1);
    marker.userData.ring.scale.set(scale, scale, 1);
    marker.userData.dot.scale.set(scale, scale, 1);
    
    marker.userData.pulse.material.opacity = 0.3 + (Math.sin(elapsed * 2) * 0.15);
    
    marker.userData.ring.lookAt(camera.position);
    marker.userData.pulse.lookAt(camera.position);
    marker.userData.dot.lookAt(camera.position);
  });
  
  // Sub-markers face camera
  subMarkers.forEach(function(subMarker) {
    if (subMarker.visible) {
      subMarker.userData.ring.lookAt(camera.position);
      subMarker.userData.dot.lookAt(camera.position);
    }
  });

  if (hoveredMarker && locationLabel.classList.contains('visible')) {
    updateLocationLabel(hoveredMarker);
  }
  if (locationActions && locationActions.classList.contains('visible')) {
    updateLocationActionsButtons();
    updateLocationActionsLayout();
  }
  
  // Mettre Ã  jour les labels HTML des sous-lieux
  updateSubLocationLabels();
  
  renderer.render(scene, camera);
}

// INIT MARS SCENE
function initMarsScene() {
  console.log('ðŸŽ¬ initMarsScene() appelÃ©e');
  
  Promise.all([
  loader.loadAsync('mars.glb'),
  texLoader.loadAsync('night.png')
]).then(function(results) {
  console.log('ðŸ“¦ ModÃ¨le 3D et textures chargÃ©s');
  var gltf = results[0];
  var nightTex = results[1];
  
  nightTex.wrapS = nightTex.wrapT = THREE.ClampToEdgeWrapping;
  
  var dayTex = null;
  gltf.scene.traverse(function(child) {
    if (child.isMesh) {
      dayTex = child.material.map;
    }
  });
  
  // AtmosphÃ¨re
  var sunDir = new THREE.Vector3(5.0, 0.5, 1.0).normalize();
  var atmosGeom = new THREE.SphereGeometry(41.2, 32, 32);
  var atmosMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    uniforms: { uSunDir: { value: sunDir } },
    vertexShader: 'varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 uSunDir; varying vec3 vNormal; void main() { float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 3.5); float sunVisibility = smoothstep(0.0, 0.5, dot(vNormal, uSunDir)); vec3 atmosColor = vec3(1.0, 0.45, 0.25); gl_FragColor = vec4(atmosColor * intensity * sunVisibility * 1.8, intensity * 0.8); }'
  });
  scene.add(new THREE.Mesh(atmosGeom, atmosMat));
  
  // SphÃ¨re Mars
  var marsGeom = new THREE.SphereGeometry(40, 64, 64);
  
  if (dayTex) {
    dayTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    dayTex.minFilter = THREE.LinearMipmapLinearFilter;
    dayTex.magFilter = THREE.LinearFilter;
    dayTex.generateMipmaps = true;
  }
  
  if (nightTex) {
    nightTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    nightTex.minFilter = THREE.LinearMipmapLinearFilter;
    nightTex.magFilter = THREE.LinearFilter;
    nightTex.generateMipmaps = true;
  }
  
  var marsMat = new THREE.ShaderMaterial({
    uniforms: {
      uDayTex: { value: dayTex },
      uNightTex: { value: nightTex },
      uSunDir: { value: sunDir },
      uNightScale: { value: 1.8 },
      uNightOffset: { value: new THREE.Vector2(-0.22, 0.0) }
    },
    vertexShader: 'varying vec2 vUv; varying vec3 vNormal; void main() { vUv = uv; vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform sampler2D uDayTex; uniform sampler2D uNightTex; uniform vec3 uSunDir; uniform float uNightScale; uniform vec2 uNightOffset; varying vec2 vUv; varying vec3 vNormal; void main() { float light = dot(vNormal, uSunDir); vec4 day = texture2D(uDayTex, vUv); day.rgb *= 1.05; day.r *= 0.88; day.g *= 0.96; vec2 centeredUv = (vUv - 0.5 + uNightOffset) * uNightScale + 0.5; vec3 nightColor = vec3(0.0); if(centeredUv.x >= 0.0 && centeredUv.x <= 1.0 && centeredUv.y >= 0.0 && centeredUv.y <= 1.0) { vec4 texCol = texture2D(uNightTex, centeredUv); vec3 correctedNight = pow(texCol.rgb, vec3(3.0)); float edgeMask = smoothstep(0.5, 0.3, distance(centeredUv, vec2(0.5))); float nightVisibility = smoothstep(-0.2, -0.5, light); nightColor = correctedNight * 4.0 * edgeMask * nightVisibility; } float mixFactor = smoothstep(-0.5, 0.5, light); gl_FragColor = vec4(mix(nightColor, day.rgb, mixFactor), 1.0); }'
  });
  
  marsSphere = new THREE.Mesh(marsGeom, marsMat);
  marsSphere.rotation.y = Math.PI * 0.5;
  scene.add(marsSphere);
  
  // Ajouter les markers Ã  Mars
  marsSphere.add(markerGroup);
  console.log('âœ… Markers ajoutÃ©s Ã  Mars:', markerGroup.children.length);
  
  // Ajouter les sub-markers Ã  Mars
  marsSphere.add(subMarkerGroup);
  console.log('âœ… Sub-markers ajoutÃ©s Ã  Mars:', subMarkerGroup.children.length);
  
  // DÃ©marrer l'animation
  console.log('ðŸŽ¥ DÃ©marrage de l\'animation...');
  animate();
  console.log('âœ… Mars complÃ¨tement initialisÃ©e!');
}).catch(function(error) {
  console.error('âŒ ERREUR lors du chargement 3D:', error);
  console.error('Stack:', error.stack);
});
}
