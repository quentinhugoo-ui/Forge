[package]
name = "forge-ui"
version = "0.1.0"
description = "Forge minimal Tauri interface"
edition = "2021"
default-run = "forge-ui"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
scan = { path = "../../..", features = ["cuda", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "rustls"] }
rfd = "0.15.4"
# Banger engine — native GPU lifecycle (P1a). Same versions as scan parent crate.
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan", "metal"] }
pollster = "0.4"
portable-pty = "0.9.0"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
keyring = "3"

[features]
# Forwarders so cfg!(feature = "...") in main.rs resolves correctly,
# AND match the actual scan dep feature config above (cuda is on).
default = ["cuda", "wgpu"]
wgpu = ["scan/wgpu"]
cuda = ["scan/cuda"]

[profile.dev]
# MSVC can fail linking the Tauri binary with LNK1318 when the generated PDB
# grows too large. Keep dev builds fast and linkable; use release/profiled
# builds when full debug symbols are needed.
debug = 0
