<svg xmlns="http://www.w3.org/2000/svg" width="265" height="604" viewBox="0 0 265 604" fill="none">
  <defs>
    <pattern id="dot-grid" width="20" height="24" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#eeeee8" opacity="0.18"/>
    </pattern>
    <linearGradient id="fade-y" x1="0" y1="0" x2="0" y2="604" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.08" stop-color="white" stop-opacity="1"/>
      <stop offset="0.9" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade-mask">
      <rect width="265" height="604" fill="url(#fade-y)"/>
    </mask>
  </defs>
  <rect width="265" height="604" fill="url(#dot-grid)" mask="url(#fade-mask)"/>
</svg>
