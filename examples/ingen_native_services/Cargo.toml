[package]
name = "ingen-native-services"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
scan = { path = "../..", features = ["cuda", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan", "metal"] }
pollster = "0.4"
draco_decoder = "0.0.28"
meshopt = "0.6.2"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
