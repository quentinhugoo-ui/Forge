[package]
name = "ingen-native-front"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "1.16.1", default-features = true, features = ["backend-winit", "raw-window-handle-06", "unstable-winit-030"] }
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan", "metal"] }

[build-dependencies]
slint-build = "1.16.1"
