[package]
name = "scan"
version = "0.10.0"
edition = "2021"
description = "Content-addressed KASM execution, distributed by git refs"
license = "MIT"
publish = false

[lib]
name = "scan"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
# wgpu trimmed to Vulkan + Metal — DX12 and GLES backends pull a windows
# crate version that conflicts with tauri's transitive dep, and neither
# have the StdError impl wgpu-hal expects. Vulkan covers NVIDIA, AMD,
# Intel on Windows/Linux; Metal covers macOS. We've verified Vulkan is
# present on the user's Windows laptop via vulkan_available().
wgpu = { version = "29", optional = true, default-features = false, features = ["wgsl", "vulkan", "metal"] }
pollster = { version = "0.4", optional = true }
# cudarc dropped (Phase C moonshot 2026-05-01) — Forge now uses its own
# minimal nvcuda.dll FFI (src/cuda_min.rs) + pre-compiled PTX embedded
# at build time. Result: Forge depends only on the NVIDIA driver, not
# on the CUDA Toolkit, not on a specific CUDA version, not on cudarc's
# Rust API churn.

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster"]
cuda = []  # cuda_min uses dynamic loading of nvcuda.dll, no compile-time dep

